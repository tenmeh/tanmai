url: https://tenmeh.github.io/tanmai/

template:
  bootstrap: 5
  light-switch: true
  default-theme: light
  bslib:
    # The site's accent is the app's accent, so the docs and the thing they
    # document do not look like different products.
    primary: "#1f9d61"
    # Set as plain Sass variables rather than through bslib's font helpers:
    # Poppins is served from pkgdown/fonts by @font-face in extra.css, so
    # there is nothing for bslib to fetch or bundle.
    font-family-base: "Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    headings-font-family: "Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-family-monospace: "'JetBrains Mono', 'SF Mono', 'Cascadia Mono', Consolas, monospace"
    headings-font-weight: 600
    border-radius: "0.6rem"

home:
  title: Tanmai Chess
  description: >
    Screenshot a chess board, get the best move - and get told where a player of
    a given strength is about to go wrong.
  sidebar:
    structure: [links, license, citation, authors, dev]
    components:
      links:
        title: Links
        text: |
          [Live app](https://tanmai-103985161147.us-central1.run.app/)

navbar:
  structure:
    left: [intro, concepts, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Getting Started
      href: articles/tanmai-chess.html
    concepts:
      text: How it works
      menu:
        - text: The Blunder Radar
          href: articles/blunder-radar.html
        - text: Following a live game
          href: articles/live-tracking.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github fa-lg
      href: https://github.com/tenmeh/tanmai
      aria-label: GitHub repository

